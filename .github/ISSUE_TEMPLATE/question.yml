name: Question
description: Ask a question about using Compass
title: "[Question] "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: "Have a question? We're here to help."
  - type: textarea
    id: question
    attributes:
      label: "Your Question"
      description: "What do you want to know?"
      placeholder: "How do I...?"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: "Context"
      description: "What were you trying to do when you had this question?"
      placeholder: "I was in Assess mode and noticed..."
