name: Feature Request
description: Suggest a new feature or improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: "Help us improve Compass with your ideas!"
  - type: textarea
    id: use-case
    attributes:
      label: "Use Case"
      description: "What problem does this solve or what capability does it add?"
      placeholder: "I want to export the drift audit results as a CSV so I can share with my team..."
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: "Which Mode(s)?"
      multiple: true
      options:
        - Found
        - Assess
        - Revive
        - Reposition
        - History
        - All Modes
  - type: textarea
    id: details
    attributes:
      label: "Additional Details"
      placeholder: "Any other context or mockups?"
