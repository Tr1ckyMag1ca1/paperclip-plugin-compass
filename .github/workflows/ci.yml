name: CI Verification

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  checks: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run verification gate
        run: npm run verify
        # Runs: typecheck + lint:shim + test:run + size-limit + check-externals + npm pack dry-run

      - name: Build plugin bundles
        run: npm run build
