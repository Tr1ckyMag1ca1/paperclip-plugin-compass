name: Release & Publish

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  id-token: write
  releases: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run full verify gate
        run: npm run verify
        # This runs: typecheck + lint:shim + test:run + size-limit + check-externals + npm pack dry-run

      - name: Build plugin bundles
        run: npm run build

      - name: Pack for npm
        run: npm pack

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Extract version and changelog notes
        id: release_info
        shell: bash
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          # Extract CHANGELOG section for this version
          NOTES=$(grep -A 1000 "## \[$VERSION\]" CHANGELOG.md | grep -B 1000 "^## " | tail -n +2 | sed '$d')
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release with .tgz artifact
        uses: softprops/action-gh-release@v2
        with:
          files: ./paperclip-plugin-compass-*.tgz
          body: ${{ steps.release_info.outputs.notes }}
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
